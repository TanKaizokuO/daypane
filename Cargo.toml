# ─── The app's name is defined ONCE, here. ───────────────────────────────────
# Rename the project by changing `name` below; everything else derives from it
# via `env!("CARGO_PKG_NAME")` (see src/app.rs). Do not hard-code the name
# anywhere else — `scripts/check-name.sh` enforces this.
[package]
name = "daypane"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Waybar calendar popup: Google Calendar on the left, local tasks on the right, agent-drivable via MCP"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gtk4 = { version = "0.11.5", features = ["v4_14"], optional = true }
gtk4-layer-shell = { version = "0.8.1", optional = true }
notify = "8"
oo7 = { version = "0.7.1", default-features = false, features = ["tokio", "native_crypto"] }
rand = "0.10.3"
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.8"
zbus = { version = "6.3.0", default-features = false, features = ["tokio"] }

[features]
# `gui` builds the GTK4 layer-shell popup. Disable (`--no-default-features`) for
# headless builds/CI where GTK4 / gtk4-layer-shell dev libraries are unavailable.
default = ["gui"]
gui = ["dep:gtk4", "dep:gtk4-layer-shell"]

[dev-dependencies]
tempfile = "3.27.0"
